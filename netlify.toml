[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Map the app's /api/uploads calls to the Netlify Function.
# (Must come BEFORE the SPA catch-all so it isn't rewritten to index.html.)
[[redirects]]
  from = "/api/uploads"
  to = "/.netlify/functions/uploads"
  status = 200

# Server-side Overpass proxy so the browser never talks to Overpass directly
# (avoids CORS / ERR_FAILED against public mirrors). An EDGE function so it can
# STREAM responses larger than the ~6 MB regular-function cap (province queries
# are 10-15 MB+). Edge functions run before redirects, so /api/overpass is
# handled here and never hits the SPA catch-all.
[[edge_functions]]
  path = "/api/overpass"
  function = "overpass"

# SPA fallback so react-router routes work on refresh / deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
